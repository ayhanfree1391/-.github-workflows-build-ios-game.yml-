name: 🖥️ macOS VNC (Auto-Healing)

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Session timeout (minutes)'
        required: true
        default: '60'
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true
        default: 'MacVNC12'

jobs:
  vnc:
    runs-on: macos-14
    timeout-minutes: 360
    
    steps:
      # ═══ 1. Enable VNC ═══
      - name: 🖥️ Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -restart -agent -privs -all 2>&1 || true
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${{ inputs.vnc_password }}" \
            -restart -agent 2>&1 || true
          
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off 2>&1 || true
          sleep 2
          echo "✅ VNC enabled"
      
      # ═══ 2. Install noVNC + websockify ═══
      - name: 📦 Install noVNC
        run: |
          git clone --depth=1 https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv /tmp/wsvenv
          /tmp/wsvenv/bin/pip install --quiet websockify
          echo "✅ noVNC + websockify installed"
      
      # ═══ 3. Install cloudflared ═══
      - name: 📦 Install cloudflared
        run: |
          curl -L -o /tmp/cloudflared.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp
          sudo mv /tmp/cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
      
      # ═══ 4. Start services (with watchdog) ═══
      - name: 🌐 Start services
        run: |
          echo "=== Starting websockify ==="
          nohup /tmp/wsvenv/bin/websockify --web=/tmp/novnc 6080 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          echo $! > /tmp/ws.pid
          
          sleep 5
          
          echo "=== Starting cloudflared ==="
          nohup cloudflared tunnel --url http://localhost:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cf.pid
          
          sleep 10
          
          # منتظر URL
          URL=""
          for i in $(seq 1 30); do
            sleep 2
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            [ -n "$URL" ] && break
          done
          
          if [ -z "$URL" ]; then
            echo "❌ No URL"
            cat /tmp/cloudflared.log
            exit 1
          fi
          
          echo "url=$URL" >> $GITHUB_OUTPUT
          VNC_URL="${URL}/vnc.html?autoconnect=true&password=${{ inputs.vnc_password }}&resize=scale"
          
          echo "═══════════════════════════════════════════════════"
          echo "🎯 VNC URL:"
          echo "$VNC_URL"
          echo "═══════════════════════════════════════════════════"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🖥️ macOS VNC Ready
          
          ## 🎉 **[👉 Click to Connect]($VNC_URL)**
          
          \`\`\`
          $VNC_URL
          \`\`\`
          
          ## 🔑 Password
          \`${{ inputs.vnc_password }}\`
          
          ## ⏱️ Timeout
          ${{ inputs.timeout }} minutes
          
          ## ⚠️ اگه قطع شد
          اگه لینک کار نکرد، این صفحه رو Refresh کن و لینک جدید بردار!
          EOF
      
      # ═══ 5. Watchdog + Keep alive ═══
      - name: 🐕 Watchdog (auto-restart)
        run: |
          MINUTES=${{ inputs.timeout }}
          
          for i in $(seq 1 $MINUTES); do
            echo "───────────────────────────────"
            echo "[$i/$MINUTES] $(date '+%H:%M:%S')"
            
            # چک websockify
            if ! curl -s http://localhost:6080/vnc.html 2>/dev/null | grep -q "noVNC"; then
              echo "⚠️ websockify died, restarting..."
              pkill -f websockify 2>/dev/null || true
              sleep 2
              nohup /tmp/wsvenv/bin/websockify --web=/tmp/novnc 6080 localhost:5900 \
                > /tmp/websockify.log 2>&1 &
              sleep 3
              echo "✅ websockify restarted"
            else
              echo "✅ websockify OK"
            fi
            
            # چک cloudflared هر ۵ دقیقه
            if [ $((i % 5)) -eq 0 ]; then
              if ! kill -0 $(cat /tmp/cf.pid) 2>/dev/null; then
                echo "⚠️ cloudflared died, restarting..."
                sleep 2
                nohup cloudflared tunnel --url http://localhost:6080 \
                  --no-autoupdate \
                  > /tmp/cloudflared.log 2>&1 &
                echo $! > /tmp/cf.pid
                sleep 10
                
                # URL جدید
                NEW_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | tail -1)
                echo "🔄 New URL: $NEW_URL"
                
                # به summary اضافه کن
                cat >> $GITHUB_STEP_SUMMARY << EOF
                
                ## 🔄 URL Updated at $(date '+%H:%M:%S')
                **[👉 New Link](https://$NEW_URL/vnc.html?autoconnect=true&password=${{ inputs.vnc_password }})**
                EOF
              else
                echo "✅ cloudflared OK"
              fi
            fi
            
            sleep 60
          done
      
      # ═══ 6. Cleanup ═══
      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill cloudflared 2>/dev/null || true
          pkill -f websockify 2>/dev/null || true
          echo "✅ Done"
