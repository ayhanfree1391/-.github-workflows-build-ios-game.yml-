name: 🖥️ macOS VNC

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Session timeout (minutes)'
        required: true
        default: '60'
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true
        default: 'MacVNC12'

jobs:
  vnc:
    runs-on: macos-14
    timeout-minutes: 360
    
    steps:
      - name: 🖥️ Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -restart -agent -privs -all 2>&1 || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${{ inputs.vnc_password }}" \
            -restart -agent 2>&1 || true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off 2>&1 || true
          sleep 2
          echo "✅ VNC enabled"
      
      - name: 📦 Install noVNC
        run: |
          git clone --depth=1 https://github.com/novnc/noVNC.git /tmp/novnc
          python3 -m venv /tmp/wsvenv
          /tmp/wsvenv/bin/pip install --quiet websockify
          echo "✅ noVNC + websockify"
      
      - name: 📦 Install cloudflared
        run: |
          curl -L -o /tmp/cf.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cf.tgz -C /tmp
          sudo mv /tmp/cloudflared /usr/local/bin/
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
      
      - name: 🌐 Start services
        id: start
        run: |
          nohup /tmp/wsvenv/bin/websockify --web=/tmp/novnc 6080 localhost:5900 \
            > /tmp/ws.log 2>&1 &
          sleep 5
          
          nohup cloudflared tunnel --url http://localhost:6080 \
            --no-autoupdate > /tmp/cf.log 2>&1 &
          echo $! > /tmp/cf.pid
          
          URL=""
          for i in $(seq 1 30); do
            sleep 2
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
          done
          
          if [ -z "$URL" ]; then
            cat /tmp/cf.log
            exit 1
          fi
          
          VNC_URL="${URL}/vnc.html?autoconnect=true&password=${{ inputs.vnc_password }}&resize=scale"
          echo "url=$VNC_URL" >> $GITHUB_OUTPUT
          
          echo "═══════════════════════════════════"
          echo "🎯 $VNC_URL"
          echo "═══════════════════════════════════"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🖥️ macOS VNC
          
          ## [👉 Click to Connect]($VNC_URL)
          
          ## Password: \`${{ inputs.vnc_password }}\`
          
          ⏱️ Timeout: ${{ inputs.timeout }} min
          
          ---
          **اگه لینک کار نکرد، این صفحه رو Refresh کن و لینک جدید بگیر!**
          EOF
      
      - name: ⏳ Keep alive
        run: |
          MINUTES=${{ inputs.timeout }}
          for i in $(seq 1 $MINUTES); do
            echo "[$i/$MINUTES] $(date '+%H:%M:%S')"
            
            # چک websockify
            if ! curl -s http://localhost:6080/vnc.html 2>/dev/null | grep -q "noVNC"; then
              echo "⚠️ websockify restart..."
              pkill -f websockify 2>/dev/null || true
              sleep 2
              nohup /tmp/wsvenv/bin/websockify --web=/tmp/novnc 6080 localhost:5900 \
                > /tmp/ws.log 2>&1 &
              sleep 3
            fi
            
            # چک cloudflared هر ۵ دقیقه
            if [ $((i % 5)) -eq 0 ]; then
              if ! kill -0 $(cat /tmp/cf.pid 2>/dev/null) 2>/dev/null; then
                echo "⚠️ cloudflared restart..."
                sleep 2
                nohup cloudflared tunnel --url http://localhost:6080 \
                  --no-autoupdate > /tmp/cf.log 2>&1 &
                echo $! > /tmp/cf.pid
                sleep 10
                NEW=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | tail -1)
                echo "🔄 New URL: $NEW"
              fi
            fi
            
            sleep 60
          done
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill cloudflared 2>/dev/null || true
          pkill -f websockify 2>/dev/null || true
          echo "Done"
