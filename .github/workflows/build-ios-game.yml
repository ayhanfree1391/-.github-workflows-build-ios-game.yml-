name: 🖥️ macOS VNC Session

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Session timeout (minutes)'
        required: true
        default: '60'
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true
        default: 'MacVNC12'

jobs:
  vnc:
    runs-on: macos-14
    timeout-minutes: 360
    
    steps:
      # ═══ 1. Verify Secret ═══
      - name: 🔐 Verify secret
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "❌ NGROK_AUTHTOKEN not set!"
            exit 1
          fi
          echo "✅ Token OK (length: ${#NGROK_AUTHTOKEN})"
      
      # ═══ 2. Enable VNC ═══
      - name: 🖥️ Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -restart -agent -privs -all 2>&1 || true
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${{ inputs.vnc_password }}" \
            -restart -agent 2>&1 || true
          
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off 2>&1 || true
          
          sleep 2
          echo "✅ VNC enabled"
      
      # ═══ 3. Install ngrok ═══
      - name: 📦 Install ngrok
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-darwin-amd64.zip -o /tmp/ngrok.zip
          unzip -o -q /tmp/ngrok.zip -d /tmp
          sudo mv /tmp/ngrok /usr/local/bin/
          sudo chmod +x /usr/local/bin/ngrok
          ngrok version
      
      # ═══ 4. Configure ngrok (FIXED) ═══
      - name: 🔐 Configure ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # روش رسمی — خود ngrok مسیر درست رو می‌سازه
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          
          echo "═══════════════════════════════"
          echo "✅ Authtoken configured"
          echo "═══════════════════════════════"
          
          # نمایش مسیر config
          find ~/Library -name "ngrok.yml" 2>/dev/null | head -3
      
      # ═══ 5. Start ngrok ═══
      - name: 🌐 Start ngrok tunnel
        id: ngrok
        run: |
          echo "=== Starting ngrok ==="
          nohup ngrok tcp 5900 --log=/tmp/ngrok.log > /dev/null 2>&1 &
          echo $! > /tmp/ngrok.pid
          
          for i in $(seq 1 30); do
            sleep 1
            if curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -q "tcp://"; then
              echo "✅ ngrok ready in ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ ngrok failed"
              echo "═══════════════════════════════"
              cat /tmp/ngrok.log
              echo "═══════════════════════════════"
              exit 1
            fi
          done
          
          TUNNEL=$(curl -s http://localhost:4040/api/tunnels)
          PUBLIC_URL=$(echo "$TUNNEL" | jq -r '.tunnels[0].public_url')
          HOST_PORT=$(echo "$PUBLIC_URL" | sed 's|tcp://||')
          HOST=$(echo "$HOST_PORT" | cut -d: -f1)
          PORT=$(echo "$HOST_PORT" | cut -d: -f2)
          
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT
          
          echo "═══════════════════════════════"
          echo "🎯 VNC READY"
          echo "🌐 Host: $HOST"
          echo "🔌 Port: $PORT"
          echo "🔑 Pass: ${{ inputs.vnc_password }}"
          echo "═══════════════════════════════"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🖥️ macOS VNC Ready
          
          | | |
          |---|---|
          | 🌐 **Host** | \`$HOST\` |
          | 🔌 **Port** | \`$PORT\` |
          | 🔑 **Password** | \`${{ inputs.vnc_password }}\` |
          
          ## 📱 Connect
          
          \`\`\`
          open vnc://$HOST:$PORT
          \`\`\`
          EOF
      
      # ═══ 6. Keep alive ═══
      - name: ⏳ Keep session alive
        run: |
          for i in $(seq 1 ${{ inputs.timeout }}); do
            if [ $((i % 5)) -eq 0 ]; then
              if ! curl -s http://localhost:4040/api/tunnels 2>/dev/null | grep -q "tcp://"; then
                echo "⚠️ ngrok restarting..."
                nohup ngrok tcp 5900 --log=/tmp/ngrok.log > /dev/null 2>&1 &
                sleep 10
              fi
            fi
            echo "[$i/${{ inputs.timeout }}] $(date '+%H:%M:%S')"
            sleep 60
          done
      
      # ═══ 7. Cleanup ═══
      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill ngrok 2>/dev/null || true
          echo "✅ Done"
