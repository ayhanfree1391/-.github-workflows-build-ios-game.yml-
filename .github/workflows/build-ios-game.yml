name: 🖥️ macOS VNC via Tailscale

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Session timeout (minutes)'
        required: true
        default: '60'
      vnc_password:
        description: 'VNC password (max 8 chars)'
        required: true
        default: 'MacVNC12'

jobs:
  vnc:
    runs-on: macos-14
    timeout-minutes: 360
    
    steps:
      # ═══ 1. Enable VNC ═══
      - name: 🖥️ Enable VNC
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -restart -agent -privs -all 2>&1 || true
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${{ inputs.vnc_password }}" \
            -restart -agent 2>&1 || true
          
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off 2>&1 || true
          sleep 2
          echo "✅ VNC enabled"
      
      # ═══ 2. Setup Tailscale ═══
      - name: 🌐 Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
      
      # ═══ 3. Get Tailscale IP ═══
      - name: 🔗 Show connection info
        run: |
          sleep 5
          
          IP=$(tailscale ip -4)
          HOSTNAME=$(tailscale status --json | jq -r '.Self.HostName')
          
          echo "═══════════════════════════════════"
          echo "🎯 VNC READY"
          echo "═══════════════════════════════════"
          echo "🌐 Tailscale IP: $IP"
          echo "🖥️ Hostname: $HOSTNAME"
          echo "🔌 VNC Port: 5900"
          echo "🔑 Password: ${{ inputs.vnc_password }}"
          echo "═══════════════════════════════════"
          echo ""
          echo "📱 Connect from your device:"
          echo "   1. Install Tailscale on your device"
          echo "   2. Login to same account"
          echo "   3. Run: open vnc://$IP:5900"
          echo "═══════════════════════════════════"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🖥️ macOS VNC via Tailscale
          
          ## 🔗 Connection Info
          
          | | |
          |---|---|
          | 🌐 **Tailscale IP** | \`$IP\` |
          | 🖥️ **Hostname** | \`$HOSTNAME\` |
          | 🔌 **VNC Port** | \`5900\` |
          | 🔑 **Password** | \`${{ inputs.vnc_password }}\` |
          
          ## 📱 Setup on Your Device
          
          ### 1. Install Tailscale
          - macOS: https://tailscale.com/download/mac
          - Windows: https://tailscale.com/download/windows
          - iOS: App Store → Tailscale
          - Android: Play Store → Tailscale
          
          ### 2. Login to Same Account
          Use same Tailscale account
          
          ### 3. Connect via VNC
          
          **macOS:**
          \`\`\`
          open vnc://$IP:5900
          \`\`\`
          
          **Windows (RealVNC / MS RDP):**
          \`\`\`
          $IP:5900
          \`\`\`
          
          **Linux:**
          \`\`\`bash
          remmina -c vnc://$IP:5900
          \`\`\`
          
          ## ⏱️ Timeout
          ${{ inputs.timeout }} minutes
          
          ## 📝 Info
          - Started: $(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
      
      # ═══ 4. Keep alive ═══
      - name: ⏳ Keep session alive
        run: |
          IP=$(tailscale ip -4)
          for i in $(seq 1 ${{ inputs.timeout }}); do
            echo "[$i/${{ inputs.timeout }}] $(date '+%H:%M:%S') - IP: $IP"
            sleep 60
          done
      
      # ═══ 5. Cleanup ═══
      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "✅ Done"
